<!DOCTYPE html>
<html lang="id" style="background-color:#0A0A0C;color-scheme:dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ibudd — Contact</title>
    <style>html,body{background-color:#0A0A0C}</style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <a href="/" class="logo"><span>I</span>budd</a>
        <nav>
            <a href="/">Home</a>
            <a href="/about">About</a>
            <a href="/skills">Skills</a>
            <a href="/projects">Projects</a>
            <a href="/blog">Blog</a>
            <a href="/contact" class="active">Contact</a>
        </nav>
    </header>
    
    <main>
        <section class="section">
            <h3 class="section-title">Hubungi Saya</h3>
            <p class="text-muted mb-3">Silakan hubungi saya melalui email atau media sosial di bawah ini.</p>

            <ul class="contact-list stagger">
                <li>
                    <span class="icon"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 6L2 7"/></svg></span>
                    <span class="label">Email</span>
                    <span class="value">mohamadbw01@gmail.com</span>
                </li>
                <li>
                    <span class="icon"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4 4 0 0 0-4-4 4 4 0 0 0-4 4v4"/><path d="M9 14a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg></span>
                    <span class="label">GitHub</span>
                    <span class="value">github.com/IbuddSoftware</span>
                </li>
                <li>
                    <span class="icon"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/></svg></span>
                    <span class="label">Instagram</span>
                    <span class="value">@mobuww_</span>
                </li>
                <li>
                    <span class="icon"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h4v16H4zM10 4h4v16h-4z"/><circle cx="19" cy="7" r="1.6"/><path d="M19 10v10"/></svg></span>
                    <span class="label">LinkedIn</span>
                    <span class="value">linkedin.com/in/Ibudd</span>
                </li>
            </ul>
        </section>

        <section class="section">
            <h3 class="section-title">Kirim Pesan</h3>
            <form action="/contact" method="GET">
                <div class="form-group">
                    <label for="name">Nama</label>
                    <input type="text" id="name" name="name" placeholder="Masukkan nama Anda">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Masukkan email Anda">
                </div>
                <div class="form-group">
                    <label for="message">Pesan</label>
                    <textarea id="message" name="message" placeholder="Tulis pesan Anda di sini..."></textarea>
                </div>
                <button type="submit" class="btn">Kirim</button>
            </form>
        </section>
    </main>

    <footer>
        &copy; 2007 IBUDD
    </footer>
</body>
</html>
